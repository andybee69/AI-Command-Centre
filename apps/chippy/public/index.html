<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chippy Command Centre</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><aside class="sidebar"><a class="brand" href="#home"><span class="brand-icon">C</span><span>CHIPPY<small>COMMAND CENTRE</small></span></a><p class="nav-label">YOUR WORKSPACE</p><nav aria-label="Main navigation"><a href="#home">◫ <span>Home</span></a><a href="#chat">✦ <span>Chippy Chat</span></a><a href="#projects">▤ <span>Projects</span></a><a href="#inbox">↓ <span>Gigi / Inbox</span></a><a href="#todo">✓ <span>To-Do</span></a><a href="#system">● <span>System</span></a></nav><div class="sidebar-foot"><span class="dot"></span> Local workspace<small>One board. One next step.</small></div></aside>
<main><header><span>YOUR COMMAND CENTRE</span><span id="today"></span></header><div id="notice" role="status" aria-live="polite"></div><div id="view"><p>Loading your projects…</p></div><footer>Project notes stay on this PC. AGON_BRAIN remains the business source. <button id="export" class="text-button">Export board</button></footer></main>
<dialog id="project-dialog"><form id="project-form"><div class="dialog-heading"><div><p class="eyebrow">PROJECT DETAILS</p><h2 id="project-title"></h2></div><button type="button" id="close-dialog" aria-label="Close project">✕</button></div><label>Status<select name="status" id="edit-status"></select></label><label>Stage<input name="stage" required maxlength="2000"></label><label>Next action<textarea name="nextAction" required maxlength="2000" rows="3"></textarea></label><label>Notes<textarea name="notes" maxlength="2000" rows="3"></textarea></label><label class="check"><input type="checkbox" name="confirmed"> I have confirmed this project’s current position</label><p id="project-source" class="source"></p><p id="save-error" role="alert"></p><div class="dialog-actions"><button type="button" id="project-chat" class="secondary">Discuss with Chippy</button><button type="submit" class="primary">Save project</button></div></form></dialog></body></html>
